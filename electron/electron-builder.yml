appId: com.liulixinlex.autogptfree
productName: Auto-gpt-free
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - package.json
  - node_modules/**/*

# 自动更新：从 GitHub Releases 检查
publish:
  provider: github
  owner: liulixin-lex
  repo: Auto-gpt-free

# 将 PyInstaller 产物和前端静态文件打包进 resources/
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
    - target: zip

win:
  target:
    - target: nsis

linux:
  target:
    - target: AppImage
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
