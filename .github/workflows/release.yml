name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PLAYWRIGHT_BROWSERS_PATH: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Verify frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

      - name: Audit JavaScript dependencies
        run: |
          cd frontend && npm audit --audit-level=high
          cd ../electron && npm audit --audit-level=high

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install bundled Camoufox
        run: |
          python -m camoufox fetch
          python -c "from camoufox import launch_options; launch_options(headless=True)"
          python -c "from camoufox.geolocation import download_mmdb; download_mmdb()"

      - name: Build frontend
        run: cd frontend && npm ci --legacy-peer-deps && npm run build

      - name: Inject version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "__version__ = \"$VERSION\"" > core/version.py
          cd electron && npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Build Python backend
        run: |
          pip install pyinstaller
          pyinstaller --onedir --name backend \
            --add-data "platforms:platforms" \
            --add-data "core:core" \
            --add-data "api:api" \
            --add-data "services:services" \
            --add-data "providers:providers" \
            --add-data "application:application" \
            --add-data "infrastructure:infrastructure" \
            --add-data "domain:domain" \
            --add-data "static:static" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import services.turnstile_solver.api_solver \
            --hidden-import services.turnstile_solver.db_results \
            --hidden-import services.turnstile_solver.browser_configs \
            --hidden-import services.turnstile_solver.start \
            --collect-all browserforge \
            --collect-all camoufox \
            --collect-all playwright \
            --collect-all patchright \
            --collect-all apify_fingerprint_datapoints \
            --collect-all language_tags \
            --collect-all ua_parser \
            --collect-all ua_parser_builtins \
            --collect-all quart \
            --collect-all hypercorn \
            --collect-all aiofiles \
            --collect-all werkzeug \
            main.py
          python -m playwright install chromium
          python -m patchright install chromium
          PLAYWRIGHT_SOURCE="$(python -c 'from pathlib import Path; import playwright; print(Path(playwright.__file__).parent / "driver" / "package" / ".local-browsers")')"
          PLAYWRIGHT_TARGET="$(find dist/backend -type d -path '*/playwright/driver/package' -print -quit)"
          test -n "$PLAYWRIGHT_TARGET"
          mkdir -p "$PLAYWRIGHT_TARGET/.local-browsers"
          cp -R "$PLAYWRIGHT_SOURCE/." "$PLAYWRIGHT_TARGET/.local-browsers/"
          PATCHRIGHT_SOURCE="$(python -c 'from pathlib import Path; import patchright; print(Path(patchright.__file__).parent / "driver" / "package" / ".local-browsers")')"
          PATCHRIGHT_TARGET="$(find dist/backend -type d -path '*/patchright/driver/package' -print -quit)"
          test -n "$PATCHRIGHT_TARGET"
          mkdir -p "$PATCHRIGHT_TARGET/.local-browsers"
          cp -R "$PATCHRIGHT_SOURCE/." "$PATCHRIGHT_TARGET/.local-browsers/"
          CAMOUFOX_PATH="$(python -c 'from camoufox.pkgman import camoufox_path; print(camoufox_path())')"
          CAMOUFOX_CACHE="$(python -c 'from camoufox.pkgman import INSTALL_DIR; print(INSTALL_DIR)')"
          mkdir -p electron/camoufox-browser
          cp -R "$CAMOUFOX_PATH/." electron/camoufox-browser/
          mkdir -p electron/camoufox-addons electron/camoufox-geoip
          cp -R "$CAMOUFOX_CACHE/addons/." electron/camoufox-addons/
          cp -R "$CAMOUFOX_CACHE/geoip/." electron/camoufox-geoip/
          mkdir -p electron/backend
          cp -r dist/backend electron/backend/

      - name: Build Electron (macOS)
        run: |
          cd electron
          npm ci --legacy-peer-deps
          npx electron-builder --mac --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/latest-mac.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  build-win:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install bundled Camoufox
        run: |
          python -m camoufox fetch
          python -c "from camoufox import launch_options; launch_options(headless=True)"
          python -c "from camoufox.geolocation import download_mmdb; download_mmdb()"

      - name: Build frontend
        run: cd frontend && npm ci --legacy-peer-deps && npm run build

      - name: Inject version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "__version__ = `"$version`"" | Out-File -FilePath core/version.py -Encoding utf8
          cd electron
          npm version --no-git-tag-version --allow-same-version $version

      - name: Build Python backend
        run: |
          pip install pyinstaller
          pyinstaller --onedir --name backend `
            --add-data "platforms;platforms" `
            --add-data "core;core" `
            --add-data "api;api" `
            --add-data "services;services" `
            --add-data "providers;providers" `
            --add-data "application;application" `
            --add-data "infrastructure;infrastructure" `
            --add-data "domain;domain" `
            --add-data "static;static" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import services.turnstile_solver.api_solver `
            --hidden-import services.turnstile_solver.db_results `
            --hidden-import services.turnstile_solver.browser_configs `
            --hidden-import services.turnstile_solver.start `
            --collect-all browserforge `
            --collect-all camoufox `
            --collect-all playwright `
            --collect-all patchright `
            --collect-all apify_fingerprint_datapoints `
            --collect-all language_tags `
            --collect-all ua_parser `
            --collect-all ua_parser_builtins `
            --collect-all quart `
            --collect-all hypercorn `
            --collect-all aiofiles `
            --collect-all werkzeug `
            main.py
          python -m playwright install chromium
          python -m patchright install chromium
          $browserSource = python -c "from pathlib import Path; import playwright; print(Path(playwright.__file__).parent / 'driver' / 'package' / '.local-browsers')"
          $playwrightPackage = Get-ChildItem -Path dist/backend -Directory -Recurse | Where-Object { ($_.FullName -replace '\\', '/') -match '/playwright/driver/package$' } | Select-Object -First 1
          if (-not $playwrightPackage) { throw "Packaged Playwright driver directory not found" }
          $browserTarget = Join-Path $playwrightPackage.FullName ".local-browsers"
          New-Item -ItemType Directory -Force -Path $browserTarget | Out-Null
          Copy-Item -Recurse -Force "$browserSource/*" $browserTarget
          $patchrightSource = python -c "from pathlib import Path; import patchright; print(Path(patchright.__file__).parent / 'driver' / 'package' / '.local-browsers')"
          $patchrightPackage = Get-ChildItem -Path dist/backend -Directory -Recurse | Where-Object { ($_.FullName -replace '\\', '/') -match '/patchright/driver/package$' } | Select-Object -First 1
          if (-not $patchrightPackage) { throw "Packaged Patchright driver directory not found" }
          $patchrightTarget = Join-Path $patchrightPackage.FullName ".local-browsers"
          New-Item -ItemType Directory -Force -Path $patchrightTarget | Out-Null
          Copy-Item -Recurse -Force "$patchrightSource/*" $patchrightTarget
          $camoufoxSource = python -c "from camoufox.pkgman import camoufox_path; print(camoufox_path())"
          $camoufoxCache = python -c "from camoufox.pkgman import INSTALL_DIR; print(INSTALL_DIR)"
          New-Item -ItemType Directory -Force -Path electron/camoufox-browser | Out-Null
          Copy-Item -Recurse -Force "$camoufoxSource/*" electron/camoufox-browser
          New-Item -ItemType Directory -Force -Path electron/camoufox-addons | Out-Null
          Copy-Item -Recurse -Force "$camoufoxCache/addons/*" electron/camoufox-addons
          New-Item -ItemType Directory -Force -Path electron/camoufox-geoip | Out-Null
          Copy-Item -Recurse -Force "$camoufoxCache/geoip/*" electron/camoufox-geoip
          New-Item -ItemType Directory -Force -Path electron/backend
          Copy-Item -Recurse dist/backend electron/backend/
        shell: pwsh

      - name: Build Electron (Windows)
        run: |
          cd electron
          npm ci --legacy-peer-deps
          npx electron-builder --win --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-builds
          path: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  build-docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Inject version into source
        run: echo '__version__ = "${{ steps.version.outputs.version }}"' > core/version.py

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/liulixin-lex/auto-gpt-free:latest
            ghcr.io/liulixin-lex/auto-gpt-free:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build-mac, build-win, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS builds
        uses: actions/download-artifact@v4
        with:
          name: mac-builds
          path: dist/

      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          name: win-builds
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
